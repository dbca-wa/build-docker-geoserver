# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Dev Build image and Push
      inputs:
        command: buildAndPush
        dockerfile: '$(Build.SourcesDirectory)/geoserver_2_25/Dockerfile'
        tags: | 
              appsteam-geoserver_latest
              appsteam-geoserver_$(tagDate)              
        containerRegistry: DockerGitHub
        repository: ghcr.io/dbca-wa/build-docker-geoserver

